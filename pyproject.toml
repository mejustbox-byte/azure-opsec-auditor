[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-opsec-auditor"
version = "0.1.0a2"
description = "Локальный аудитор нормализованных метаданных безопасности Azure и Entra, только чтение"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = "MIT"
license-files = ["LICENSE", "LICENSE.ru.md"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
azure-opsec-auditor = "azure_opsec_auditor.cli:main"

[tool.setuptools]
packages = ["azure_opsec_auditor"]
