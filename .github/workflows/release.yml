name: release-prerelease
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Существующий alpha-тег; workflow не создаёт и не передвигает его
        required: true
        default: v0.1.0a2
        type: string
      expected_commit:
        description: Полный проверенный SHA, на который должен указывать тег
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - name: Получение проверенных инструментов выпуска
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Проверка явного тега и полного SHA
        run: python automation/scripts/publish_release.py validate-input --tag "$RELEASE_TAG" --expected-commit "$EXPECTED_COMMIT"
      - name: Получение существующего неизменяемого тега
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Проверка commit, тега, версии и принадлежности истории main
        run: python automation/scripts/publish_release.py validate-source --source release-source --tag "$RELEASE_TAG" --expected-commit "$EXPECTED_COMMIT"
      - name: Установка инструментов сборки с проверкой хешей
        working-directory: release-source
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt'
      - name: Тесты и проверки исходников
        working-directory: release-source
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_repository.py
      - name: Сборка пакетов выпуска
        working-directory: release-source
        run: python -m build --no-isolation
      - name: Нормализация метаданных архивов для безопасного повтора загрузки
        run: python automation/scripts/publish_release.py normalize --source release-source --dist release-source/dist --tag "$RELEASE_TAG" --expected-commit "$EXPECTED_COMMIT"
      - name: Проверка установки пакетов и синтетических артефактов
        working-directory: release-source
        run: |
          python scripts/verify_distribution.py
          python scripts/release_assets.py
      - name: Загрузка, публикация и проверка без перезаписи тега или артефактов
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/scripts/publish_release.py publish --source release-source --dist release-source/dist --tag "$RELEASE_TAG" --expected-commit "$EXPECTED_COMMIT"
