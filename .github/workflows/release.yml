name: release-prerelease
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing alpha tag; never created or moved by this workflow
        required: true
        default: v0.1.0a1
        type: string
      expected_commit:
        description: Approved full SHA the tag must resolve to
        required: true
        default: 698372c2b6f54707561da22e3f9ac52668c2e4a5
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - name: Checkout reviewed automation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate explicit tag and full commit input
        run: python automation/scripts/publish_release.py validate-input --tag "$RELEASE_TAG" --expected-commit "$EXPECTED_COMMIT"
      - name: Checkout immutable existing release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release commit, tag, version and main ancestry
        run: python automation/scripts/publish_release.py validate-source --source release-source --tag "$RELEASE_TAG" --expected-commit "$EXPECTED_COMMIT"
      - name: Install hash-locked build tools
        working-directory: release-source
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt'
      - name: Tests and source safety checks
        working-directory: release-source
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_repository.py
      - name: Build release packages
        working-directory: release-source
        run: python -m build --no-isolation
      - name: Normalize archive metadata for safe resumable uploads
        run: python automation/scripts/publish_release.py normalize --source release-source --dist release-source/dist --tag "$RELEASE_TAG" --expected-commit "$EXPECTED_COMMIT"
      - name: Verify normalized installed distributions and synthetic assets
        working-directory: release-source
        run: |
          python scripts/verify_distribution.py
          python scripts/release_assets.py
      - name: Upload, publish and verify prerelease without rewriting tag or assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/scripts/publish_release.py publish --source release-source --dist release-source/dist --tag "$RELEASE_TAG" --expected-commit "$EXPECTED_COMMIT"
