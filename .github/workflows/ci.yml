name: offline-ci
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: offline-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Установка инструментов сборки с проверкой хешей
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt'
      - name: Модульные тесты и проверка CLI
        run: python -m unittest discover -s tests -v
      - name: Сигнатуры секретов и ссылки документации
        run: python scripts/check_repository.py
      - name: Сборка wheel и исходного пакета
        run: python -m build --no-isolation
      - name: Установка и проверка обоих пакетов
        run: python scripts/verify_distribution.py
      - name: Создание и проверка синтетических артефактов
        run: python scripts/release_assets.py
