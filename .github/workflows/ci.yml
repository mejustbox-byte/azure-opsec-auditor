name: offline-ci
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: offline-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-locked build tools
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt
      - name: Unit and CLI integration tests
        run: python -m unittest discover -s tests -v
      - name: Repository signatures and documentation links
        run: python scripts/check_repository.py
      - name: Build wheel and source distribution
        run: python -m build --no-isolation
      - name: Install and exercise both distributions
        run: python scripts/verify_distribution.py
      - name: Generate and inspect synthetic release assets
        run: python scripts/release_assets.py
